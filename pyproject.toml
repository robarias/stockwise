[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stockwise"
version = "0.1.0"
description = "Análisis de acciones de EE. UU. y Colombia: técnico, riesgo, fundamental y series temporales."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arch>=8.0.0",
    "fpdf2>=2.8.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "plotly>=5.18",
    "pyportfolioopt>=1.6.0",
    "requests>=2.31",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "streamlit>=1.40",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
web = ["streamlit>=1.40"]
mcp = ["fastmcp>=2.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
stockwise-mcp = "stockwise.interfaces.mcp.server:main"
stockwise-web = "stockwise.interfaces.web.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "import-linter>=2.0",
    "pandas-stubs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stockwise"]

# ---------------------------------------------------------------- calidad
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # el formateador controla la longitud

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network'"
markers = ["network: requiere acceso a internet / Yahoo Finance (excluido por defecto; usar -m network)"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true

# ---------------------------------------------------------------- arquitectura (import-linter)
[tool.importlinter]
root_package = "stockwise"

[[tool.importlinter.contracts]]
name = "Capas: las dependencias solo apuntan hacia abajo"
type = "layers"
layers = [
    "stockwise.interfaces",
    "stockwise.services",
    "stockwise.viz | stockwise.data",
    "stockwise.analytics",
    "stockwise.domain",
]
